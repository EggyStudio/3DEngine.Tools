# Every push and pull request. The module is built with warnings failing the build (NORM.md, N 6.1)
# and its tests run on Linux, Windows and macOS, the systems the engines ship for (N 6.2).
name: build

# Documents are left out, the README apart, whose commands a reader follows.
on:
  push:
    paths: ['**', '!.github/**.md', '!AGENTS.md', '!.github/assets/**']
  pull_request:
    paths: ['**', '!.github/**.md', '!AGENTS.md', '!.github/assets/**']

permissions:
  contents: read

# A newer push to a branch cancels the run of the one before it, whose result nobody reads.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The images the engines' own jobs run on, Linux and macOS named rather than the latest
        # labels, so a new release under a label changes nothing with no commit to show for it.
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # The build took 8 seconds and the test 2 on a desktop from an empty package folder
    # (dotnet build Tools.slnx -warnaserror, dotnet test Tools.Tests), so 30 minutes is reached
    # only where a restore or a test hangs (N 6.8).
    timeout-minutes: 30
    steps:
      # The whole history, which the version's patch is counted from and which the README's table
      # of a module's facts names commits of.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Pillow, which the sheet composer reads and writes pictures with, from Ubuntu's archive as
      # the engines' captures take it. Windows and macOS report the sheet's test skipped with its
      # reason (N 3.2).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-pil

      - run: dotnet build Tools.slnx -warnaserror

      - run: dotnet test Tools.Tests --no-build --logger trx --results-directory Tools.Tests/TestResults

      # The tests again as Windows and macOS meet a script, through a linked temporary folder and
      # with a single-byte locale, on Linux, where both are made, so a fault of either system fails
      # in the Linux job as well (build/variants.sh). Ubuntu makes en_US.ISO-8859-1 by the name
      # en_US, and refuses the longer one.
      - if: runner.os == 'Linux'
        run: |
          sudo locale-gen en_US
          build/variants.sh

      - uses: actions/upload-artifact@v7
        # Kept for a job canceled as well as one that failed, since a cut-short run is the one to
        # read.
        if: failure() || cancelled()
        with:
          name: test-results-${{ matrix.os }}
          path: Tools.Tests/TestResults/
          if-no-files-found: ignore
